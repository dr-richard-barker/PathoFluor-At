# MIAPPE-style study description (MIAPPE 1.1 sections; Papoutsoglou et al. 2020).
# Values marked PENDING are not recorded with the data; see FACTS_PENDING.md. Nothing here is inferred.
investigation:
  title: Fluorescence hyperspectral signatures of Pseudomonas syringae challenge and flg22 in Arabidopsis seedlings
  description: >-
    Reanalysis of 2016 UW-Madison fluorescence hyperspectral imaging of Arabidopsis seedlings
    treated with mock, flg22 or Pseudomonas syringae, in Col-0 and fls2 / cml24 mutants.
  license: CC-BY-4.0
  contacts:
    - name: Richard J. Barker
      orcid: 0000-0001-5681-9857
      role: data reuser; investigator (2016)
studies:
  - id: set_A
    title: July 2016 time course
    institution: University of Wisconsin-Madison, Department of Botany (Gilroy Laboratory)   # vendor reports V1/V2
    start_date: 2016-07-22   # first sample scan, cube_manifest.csv
    end_date: 2016-07-24
    imaging:
      system: MacroPhor fluorescence hyperspectral line-scan imager (Middleton Spectral Vision)
      camera: Andor Zyla 5.5 USB3, serial VSC-03157, 12-bit low-noise mode
      excitation_nm: 488
      emission_nm: [500, 800]
      bands: 324
      wavelength_range_nm: [400.26, 808.70]
    factors:
      treatment: [Control (mock), flg22, Pathogen (Pseudomonas syringae)]
      time_h: [0 (pre-treatment), 1, 2, 3, 24, 48]
      genotype: [Col-0, fls2-17, fls2-101, cml24-2, cml24-4]
    design:
      plates_per_treatment: 4
      row_scans_per_plate: 3
      lanes_per_plate: 5      # A..E = Col-0, fls2-17, fls2-101, cml24-2, cml24-4
      experimental_unit: plate (treatment applied per plate)
    biological_material:
      organism: Arabidopsis thaliana (NCBITaxon:3702)
      accessions_and_alleles: PENDING (FACTS P9)
      growth_medium: 0.5x MS/LS basal salts, 0.1% sucrose, 0.5 g/L MES pH 5.7, 0.8% Phytagel (FACTS R21)
      seedling_age: 7 days (FACTS R21)
      growth_conditions: PENDING (FACTS P14)
    treatment_details:
      method: bacteria by flood inoculation after Ishiga et al. 2011, OD600 0.01 in 10 mM MgCl2 (FACTS R22); mock and flg22 decanted onto the plate, submerging the seedlings for about 10 s, then poured away (FACTS R23)
      pathogen_strain: Pseudomonas syringae pv. tomato DC3000 (FACTS R16)
      flg22_concentration: 1 uM, the lab's standard working concentration (FACTS R17)
      mock: Silwet L-77 per the protocol draft (not confirmed for the 2016 runs)
  - id: set_B
    title: November 2016 replicate (Sarah Sapiro)
    start_date: 2016-11-04
    end_date: 2016-11-06
    imaging:
      system: MacroPhor (Middleton Spectral Vision)
      camera: Andor Zyla 5.5, serial VSC-04393
      excitation_nm: 405
      emission_nm: [400, 800]
      bands: 406
      settings: Laser50 and Laser58 = excitation laser power 50% / 58% of maximum (FACTS R15); daily reference scans
    factors:
      treatment: [Control, flg22, Pathogen]
      time_h: [0, 6, 24, 48]
      genotype: [Col-0, fls2-17, fls2-101]   # lane order per vendor report V2 (FACTS R9)
  - id: pilot
    title: February-March 2016 pilot (leaf area from images)
    genotypes: [Col-0, fls2-101, cml24-2, cml24-4, glr3.3-1, glr3.3-2, glr3.4-1, glr3.4-2]
    time_days: [0, 1, 2, 3]
data_files:
  inventory: metadata/file_inventory.csv
  cubes: metadata/cube_manifest.csv
  roi_spectra: metadata/roi_manifest.csv
  raw_cube_archives: PENDING Zenodo DOIs (metadata/zenodo_records.csv)
